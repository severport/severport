<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460" role="img" aria-labelledby="avT avD">
  <title id="avT">Onda — lighthouse mark</title>
  <desc id="avD">A small lighthouse with a warm lamp, on a dark night sea.</desc>

  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(230 200) scale(300 300)">
      <stop offset="0" stop-color="#102034"/>
      <stop offset="0.55" stop-color="#081120"/>
      <stop offset="1" stop-color="#03070C"/>
    </radialGradient>

    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(230 146) scale(120 110)">
      <stop offset="0" stop-color="#FFE3B0" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#7FC9DF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7FC9DF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="beam" x1="230" y1="146" x2="-30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF9FF" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#D2EFF9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#D2EFF9" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tower" x1="206" y1="0" x2="254" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#122034"/>
      <stop offset="0.55" stop-color="#070C15"/>
      <stop offset="1" stop-color="#03060A"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="168" x2="0" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A8D6EA" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5C8DA8" stop-opacity="0.05"/>
    </linearGradient>

    <radialGradient id="vig" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(230 230) scale(245 245)">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <filter id="bs" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="bx" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="bb" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>

    <clipPath id="c"><circle cx="230" cy="230" r="230"/></clipPath>

    <style>.lamp { animation: fl 9s ease-in-out infinite; }
      @keyframes fl { 0%,100%{opacity:.9} 45%{opacity:1} 70%{opacity:.93} }
    </style>
  </defs>

  <g clip-path="url(#c)">
    <rect width="460" height="460" fill="url(#bg)"/>

    <g fill="#CFE3F5">
      <circle cx="86" cy="72" r="1.1" opacity="0.25"/>
      <circle cx="150" cy="46" r="0.9" opacity="0.18"/>
      <circle cx="196" cy="96" r="0.8" opacity="0.16"/>
      <circle cx="330" cy="60" r="1.0" opacity="0.22"/>
      <circle cx="382" cy="108" r="0.8" opacity="0.14"/>
      <circle cx="60" cy="140" r="0.8" opacity="0.12"/>
    </g>

    <g transform="translate(230 170) scale(1.7) translate(-230 -146)">
    <ellipse cx="230" cy="146" rx="120" ry="110" fill="url(#halo)"/>

    <g filter="url(#bb)">
      <polygon points="230,146 -40,34 -40,86" fill="url(#beam)" opacity="0.9"/>
      <polygon points="230,146 500,104 500,124" fill="url(#beam)" opacity="0.35"/>
    </g>

    <rect x="0" y="296" width="460" height="164" fill="#07101C"/>
    <line x1="0" y1="296" x2="460" y2="296" stroke="#20364F" stroke-opacity="0.6"/>

    <g stroke="#FFC98A" stroke-linecap="round" filter="url(#bx)" opacity="0.9">
      <line x1="212" y1="302" x2="248" y2="302" stroke-width="3" opacity="0.5"/>
      <line x1="208" y1="310" x2="252" y2="310" stroke-width="2.4" opacity="0.3"/>
      <line x1="216" y1="320" x2="244" y2="320" stroke-width="2" opacity="0.2"/>
      <line x1="210" y1="332" x2="250" y2="332" stroke-width="1.6" opacity="0.13"/>
    </g>

    <g>
      <path d="M214 168 L246 168 L254 298 L206 298 Z" fill="url(#tower)"/>
      <rect x="210" y="206" width="40" height="9" fill="#0C1828" opacity="0.9"/>
      <rect x="208" y="244" width="44" height="9" fill="#0C1828" opacity="0.9"/>
      <path d="M214 168 L206 298" stroke="url(#rim)" stroke-width="1.3" fill="none"/>

      <rect x="224" y="186" width="12" height="14" rx="6" fill="#16283D"/>
      <rect x="224" y="226" width="12" height="14" rx="6" fill="#16283D"/>
      <rect x="224" y="266" width="12" height="14" rx="6" fill="#16283D"/>

      <rect x="200" y="160" width="60" height="9" rx="1.6" fill="#060A11"/>
      <rect x="200" y="160" width="60" height="9" rx="1.6" fill="none" stroke="#2A4763" stroke-opacity="0.6" stroke-width="0.9"/>
      <g stroke="#24405A" stroke-opacity="0.7" stroke-width="1">
        <line x1="205" y1="151" x2="205" y2="160"/>
        <line x1="214" y1="151" x2="214" y2="160"/>
        <line x1="230" y1="151" x2="230" y2="160"/>
        <line x1="246" y1="151" x2="246" y2="160"/>
        <line x1="255" y1="151" x2="255" y2="160"/>
      </g>
      <line x1="200" y1="151" x2="260" y2="151" stroke="#24405A" stroke-opacity="0.75"/>

      <rect x="213" y="132" width="34" height="28" rx="1.2" fill="#050A12"/>
      <rect x="213" y="132" width="34" height="28" rx="1.2" fill="none" stroke="#33536F" stroke-opacity="0.75" stroke-width="1"/>
      <line x1="230" y1="132" x2="230" y2="160" stroke="#33536F" stroke-opacity="0.35"/>
      <line x1="213" y1="146" x2="247" y2="146" stroke="#33536F" stroke-opacity="0.3"/>

      <circle class="lamp" cx="230" cy="146" r="7" fill="#FFF3DA"/>
      <circle cx="230" cy="146" r="16" fill="#FFD9A0" opacity="0.45" filter="url(#bs)"/>

      <path d="M213 132 Q230 108 247 132 Z" fill="#050A12"/>
      <path d="M213 132 Q230 108 247 132" fill="none" stroke="#33536F" stroke-opacity="0.6" stroke-width="1"/>
      <line x1="230" y1="108" x2="230" y2="98" stroke="#33536F" stroke-opacity="0.6"/>
      <circle cx="230" cy="96" r="2" fill="#7FA8C2" opacity="0.6"/>
    </g>

    <ellipse cx="230" cy="298" rx="48" ry="4" fill="#02050A" opacity="0.8" filter="url(#bs)"/>
    </g>

    <rect width="460" height="460" fill="url(#vig)"/>
  </g>
</svg>
